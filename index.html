<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<meta name="theme-color" content="#0b1014">
<title>Cosmic Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #0b1014;
  --panel: #161d24;
  --field: #202930;
  --line: rgba(255,255,255,.07);
  --text: #e9edef;
  --muted: #8696a0;
  --grad: #1d5fae;
  --accent: #53a6fa;
  --onaccent: #fff;
  --danger: #ff7a90;
  --read: #53bdeb;
  --chip: rgba(83,166,250,.16);
}
:root[data-theme=light] {
  color-scheme: light;
  --bg: #f4f6fb;
  --panel: #ffffff;
  --field: #e8ecf6;
  --line: rgba(0,0,0,.08);
  --text: #161a2b;
  --muted: #5f6784;
  --grad: #4a6fa5;
  --accent: #3d5f94;
  --onaccent: #fff;
  --read: #2f6fb5;
  --chip: rgba(61,95,148,.12);
}
* {
  box-sizing: border-box;
  scrollbar-width: thin;
  scrollbar-color: rgba(138,150,166,.35) transparent;
}
::selection {
  background: rgba(83,166,250,.35);
}
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  overscroll-behavior: none;
}
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}
body {
  font: 16px/1.4 'Outfit', system-ui, -apple-system, sans-serif;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  background: none;
  border: 0;
}
button, .tab, .chip, .row, .fab {
  -webkit-tap-highlight-color: transparent;
}
[hidden] {
  display: none !important;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Main App Container */
.app {
  --lw: 340px;
  position: relative;
  max-width: 560px;
  width: 100%;
  height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
}
.hd {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 8px 0 18px;
}
.hd h1, .card h1 {
  font-family: 'Space Grotesk', 'Outfit', system-ui, sans-serif;
  font-weight: 600;
  letter-spacing: -.3px;
  color: #5aa9ff;
}
:root[data-theme=light] .hd h1, :root[data-theme=light] .card h1 {
  color: #1d6fd6;
}
.hd h1 {
  flex: 1;
  margin: 0;
  font-size: 24px;
}
.ib {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--text);
  flex: none;
}
.hd .ib {
  width: 40px;
  height: 40px;
}
.ib:active {
  background: var(--panel);
}
.ic {
  display: inline-flex;
}
.search {
  flex: 0 0 auto;
  margin: 6px 16px 4px;
  display: flex;
  align-items: center;
  gap: 12px;
  height: 46px;
  padding: 0 18px;
  border-radius: 26px;
  background: var(--field);
  color: var(--muted);
  transition: box-shadow .2s;
}
.search:focus-within {
  box-shadow: 0 0 0 2px rgba(83,166,250,.4);
}
.search input {
  flex: 1;
  min-width: 0;
  background: none;
  border: 0;
  outline: 0;
  font-size: 17px;
  color: var(--text);
}
.search input::placeholder {
  color: var(--muted);
}
#chips {
  display: none !important;
}
.chips {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  overflow-x: auto;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar {
  display: none;
}
.chip {
  padding: 8px 18px;
  border-radius: 99px;
  border: 1px solid var(--line);
  color: var(--muted);
  white-space: nowrap;
  flex: none;
}
.chip.on {
  background: var(--chip);
  border-color: transparent;
  color: var(--accent);
}
#view {
  flex: 1 1 0%;
  min-height: 0;
  overflow-y: auto;
  padding-bottom: 96px;
  overscroll-behavior: contain;
}
.row {
  display: flex;
  gap: 14px;
  align-items: center;
  width: 100%;
  text-align: left;
  padding: 12px 18px;
}
button.row:active {
  background: var(--panel);
}
.g {
  flex: 1;
  min-width: 0;
}
.g b {
  font-weight: 500;
  font-size: 17px;
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sub {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--muted);
  font-size: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
small {
  color: var(--muted);
  font-size: 13px;
}
.rt {
  display: grid;
  justify-items: end;
  gap: 6px;
  color: var(--muted);
}
.rt.u small {
  color: #53a6fa;
}
.badge {
  background: #3b8ee8;
  color: #04121f;
  border-radius: 99px;
  font-size: 12px;
  min-width: 21px;
  height: 21px;
  display: grid;
  place-items: center;
  padding: 0 6px;
  font-weight: 600;
}
.badge.mut {
  background: var(--muted);
  color: var(--bg);
}
.tk {
  color: var(--muted);
}
.tk.r {
  color: var(--read);
}
.sec {
  margin: 16px 18px 6px;
  color: var(--muted);
  font-size: 14px;
}
.empty {
  color: var(--muted);
  text-align: center;
  padding: 32px;
}
h2 {
  margin: 8px 18px 6px;
  font-size: 22px;
  font-weight: 500;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.av {
  --h: 200;
  --s: 56px;
  width: var(--s);
  height: var(--s);
  flex: none;
  border-radius: 50%;
  background: hsl(var(--h) 45% 17%);
  color: hsl(var(--h) 75% 74%);
  display: grid;
  place-items: center;
  font-weight: 500;
  font-size: calc(var(--s)/2.3);
  position: relative;
}
:root[data-theme=light] .av {
  background: hsl(var(--h) 45% 86%);
  color: hsl(var(--h) 55% 32%);
}
.av.on::after {
  content: "";
  position: absolute;
  right: 1px;
  bottom: 1px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #53a6fa;
  border: 2.5px solid var(--bg);
}
.pill {
  padding: 8px 16px;
  border-radius: 99px;
  background: var(--grad);
  color: #fff;
  font-size: 15px;
  white-space: nowrap;
}
.row .pill {
  padding: 6px 12px;
  font-size: 14px;
}
.pill.alt {
  background: var(--field);
  color: var(--text);
}
.ac {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.field {
  width: 100%;
  padding: 12px 16px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--field);
  outline: 0;
}
.field:focus {
  border-color: var(--accent);
}
.fab {
  position: absolute;
  right: 18px;
  bottom: calc(70px + env(safe-area-inset-bottom, 0px));
  width: 62px;
  height: 62px;
  border-radius: 20px;
  background: #2f84e0;
  color: #04121f;
  display: grid;
  place-items: center;
  box-shadow: 0 10px 24px rgba(0,60,140,.35);
  z-index: 3;
}
.tabs {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  background: var(--bg);
  border-top: 1px solid var(--line);
  z-index: 3;
}
.tab {
  flex: 1;
  display: grid;
  justify-items: center;
  gap: 0;
  padding: 0;
  color: var(--muted);
  font-size: 0;
}
.tab:focus, .tab:focus-visible {
  outline: none;
}
.tab, .tab * {
  transition: none;
}
.tab[data-k] {
  --c: #9bd0ff;
}
.tp {
  position: relative;
  width: 64px;
  height: 42px;
  border-radius: 21px;
  display: grid;
  place-items: center;
}
.tab.on {
  color: var(--text);
  font-weight: 600;
}
.tab.on .tp {
  background: #0f3556;
  color: #d6eaff;
}
.tab:not(.on) .tp {
  color: #8696a0;
}
.tp .badge {
  position: absolute;
  top: 0;
  right: 12px;
  min-width: 18px;
  height: 18px;
  font-size: 11px;
  background: #3b8ee8;
  color: #04121f;
}

/* Conversation Panel - Strict Top-to-Bottom Flex Sequence */
.app.in .hd, .app.in .search, .app.in .chips, .app.in #view, .app.in .tabs, .app.in .fab {
  display: none;
}
.conv {
  position: absolute;
  inset: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 5;
  background: var(--wall, var(--bg));
}
.chead, .pane, .comp, .csbar, .pinbar, .rbar, .annote, .mpop {
  position: relative;
  z-index: 2;
}
.chead {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(6px + env(safe-area-inset-top, 0px)) 6px 6px 6px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.chead .ib {
  width: 40px;
  height: 40px;
}
.chead .g, #hav {
  cursor: pointer;
}
.chead .g b {
  font-size: 16.5px;
  font-weight: 600;
}
.chead .sub {
  font-size: 12.5px;
}
#hx {
  display: flex;
  flex: none;
  align-items: center;
  gap: 2px;
}
.pane {
  flex: 1 1 0%;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px 12px 14px;
  overscroll-behavior: contain;
  background-color: transparent;
  background-image: var(--wallimg, radial-gradient(circle at 20% 25%, rgba(83,166,250,.04) 0%, transparent 45%), radial-gradient(circle at 80% 75%, rgba(45,212,191,.04) 0%, transparent 45%));
  background-size: cover;
  background-position: center;
}

/* WhatsApp Message Rows & Sequence Grouping */
.mrow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  position: relative;
  touch-action: pan-y;
}
.mrow.seq {
  margin-top: 2px;
}
.mrow.me {
  justify-content: flex-end;
}
.mrow::before {
  content: "\21A9";
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--accent);
  font-size: 22px;
  opacity: var(--sw, 0);
  pointer-events: none;
}
.mrow.arm::before {
  content: "\21a9";
  position: absolute;
  left: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--panel);
  display: grid;
  place-items: center;
  color: var(--accent);
  opacity: 1;
}

/* Sleek WhatsApp-style Bubbles */
.b {
  max-width: 82%;
  padding: 6px 10px 7px;
  border-radius: 14px;
  background: #1f2c34;
  font-size: 15.5px;
  line-height: 1.38;
  position: relative;
  touch-action: pan-y;
  box-shadow: 0 1px 1.5px rgba(0,0,0,.22);
}
.b::after {
  content: "";
  display: table;
  clear: both;
}
.b.me {
  background: var(--meb, #0d3b66);
  color: #fff;
}
.b.me.first {
  border-top-right-radius: 4px;
}
.b.th.first {
  border-top-left-radius: 4px;
}
:root[data-theme=light] .b {
  background: #fff;
}
:root[data-theme=light] .b.me {
  background: var(--meb, #2f6fb5);
  color: #fff;
}
:root[data-theme=light] .b.th {
  background: #fff;
  color: #161a2b;
}
.b.gone {
  color: var(--muted);
}
.b img {
  display: block;
  max-width: 100%;
  max-height: 320px;
  object-fit: cover;
  border-radius: 12px;
  margin: 2px 0;
}
.b.pic {
  padding: 3px;
  width: min(72%, 280px);
}
.b.pic img {
  width: 100%;
  max-width: none;
  max-height: 360px;
  object-fit: cover;
  border-radius: 12px;
  margin: 0;
}
.b.pic .meta {
  padding: 2px 6px 1px;
}
.b.pic .who {
  padding: 2px 6px 0;
}

/* Sender Name in Groups - Strictly Above Message Text */
.who {
  display: block;
  width: 100%;
  font-weight: 600;
  font-size: 13px;
  line-height: 1.25;
  color: #8ec5ff;
  margin-bottom: 2px;
}
:root[data-theme=light] .who {
  color: #1d6fd6;
}
.btxt {
  display: inline;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.btxt a.lnk {
  color: #7fd0ff;
  text-decoration: underline;
  text-underline-offset: 2px;
}
:root[data-theme=light] .b.th .btxt a.lnk {
  color: #1d6fd6;
}

/* Forwarded Label & Rich PDF/Document Attachment Cards */
.fwtag {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  font-style: italic;
  color: rgba(255,255,255,.72);
  margin-bottom: 4px;
}
:root[data-theme=light] .b.th .fwtag {
  color: var(--muted);
}
.doc {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  margin: 2px 0 4px;
  border-radius: 10px;
  background: rgba(7, 24, 44, .45);
  min-width: 225px;
  max-width: 100%;
  cursor: pointer;
}
:root[data-theme=light] .b.th .doc {
  background: rgba(0,0,0,.06);
}
.doc-ic {
  width: 36px;
  height: 42px;
  border-radius: 6px;
  background: #e53935;
  color: #fff;
  font-weight: 700;
  font-size: 11px;
  display: grid;
  place-items: center;
  flex: none;
  letter-spacing: .3px;
  position: relative;
}
.doc-info {
  min-width: 0;
  flex: 1;
  display: grid;
  gap: 2px;
}
.doc-info b {
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
}
.doc-info small {
  font-size: 12px;
  color: rgba(255,255,255,.68);
}
:root[data-theme=light] .b.th .doc-info small {
  color: var(--muted);
}
.fwbtn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(24, 34, 41, .85);
  color: #e9edef;
  display: grid;
  place-items: center;
  flex: none;
  box-shadow: 0 1px 4px rgba(0,0,0,.3);
}
.fwbtn:active {
  transform: scale(.92);
}

/* Inline Floating Timestamp */
.meta {
  float: right;
  display: inline-flex;
  gap: 4px;
  align-items: center;
  font-size: 11px;
  color: var(--muted);
  margin: 5px -2px -3px 10px;
  position: relative;
  z-index: 1;
  line-height: 1;
}
.b.me .meta {
  color: rgba(255,255,255,.78);
}
:root[data-theme=light] .b.me .meta {
  color: rgba(255,255,255,.8);
}
.b.me .tick.r {
  color: #7fd0ff;
}
.del {
  display: none;
  color: #ffb3c0;
  font-size: 12px;
}
.b:hover .del, .b.sel .del {
  display: inline;
}

/* WhatsApp Floating Date Pills */
.day {
  text-align: center;
  margin: 10px auto;
  padding: 4px 12px;
  border-radius: 8px;
  background: #182229;
  color: #8696a0;
  font-size: 12.5px;
  font-weight: 500;
  width: fit-content;
  box-shadow: 0 1px 2px rgba(0,0,0,.25);
}
:root[data-theme=light] .day {
  background: #e1ebf5;
  color: #4b5a6c;
}
.day.nm {
  color: var(--accent);
  background: var(--panel);
  width: fit-content;
  margin: 10px auto;
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .4px;
}

/* WhatsApp Bottom Composer Bar */
.comp {
  flex: 0 0 auto;
  display: flex;
  gap: 6px;
  align-items: flex-end;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  background: transparent;
  width: 100%;
}
.comp .box {
  flex: 1;
  display: flex;
  align-items: flex-end;
  background: #1f2c34;
  border-radius: 25px;
  padding: 2px 4px;
  min-width: 0;
}
:root[data-theme=light] .comp .box {
  background: #ffffff;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.comp textarea {
  flex: 1;
  resize: none;
  max-height: 120px;
  padding: 10px 4px;
  background: none;
  border: 0;
  outline: 0;
  min-width: 0;
  min-height: 42px;
  line-height: 22px;
  font-size: 16px;
  margin: 0;
}
.comp textarea::placeholder {
  color: var(--muted);
}
.comp .ib {
  width: 38px;
  height: 42px;
  flex: none;
  color: var(--muted);
}
.send {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: #007bfc;
  color: #fff;
  display: grid;
  place-items: center;
  flex: none;
  box-shadow: 0 2px 6px rgba(0,0,0,.3);
}
.send.rec {
  background: #ff5d6c;
  animation: rp 1s infinite;
}

/* Auth / Login Screen - Smooth, Non-Overlapping & Lag-Free */
.auth {
  position: relative;
  width: 100%;
  height: 100dvh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(16px + env(safe-area-inset-bottom, 0px));
  gap: 16px;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
#authart {
  position: fixed;
  inset: 0;
  background: linear-gradient(180deg, #040814, #0a1330 70%, #101b45);
}
/* Pause background animations while typing on Login page to eliminate mobile GPU lag */
.auth:focus-within .art *,
.auth:focus-within #authart * {
  animation-play-state: paused !important;
}
.auth .card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 368px;
  margin: auto;
  display: grid;
  gap: 12px;
  background: linear-gradient(165deg, rgba(18, 25, 46, .96), rgba(12, 18, 34, .98));
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 28px;
  padding: 26px 22px;
  box-shadow: 0 20px 50px rgba(0,0,0,.5);
  animation: cardin .45s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes cardin {
  from { opacity: 0; transform: translateY(12px) scale(.98); }
}
.card.shake {
  animation: shake .4s;
}
@keyframes shake {
  20%, 60% { transform: translateX(-6px); }
  40%, 80% { transform: translateX(6px); }
}
.card h1 {
  text-align: center;
  margin: 0 0 6px;
  font-size: 32px;
}
.afold {
  display: grid;
  grid-template-rows: 0fr;
  opacity: 0;
  width: 100%;
  min-width: 0;
  margin-bottom: -12px;
  transition: grid-template-rows .32s cubic-bezier(.2,.8,.2,1), opacity .22s, margin .32s cubic-bezier(.2,.8,.2,1);
}
.afold.open {
  grid-template-rows: 1fr;
  opacity: 1;
  margin-bottom: 0;
}
.afi {
  overflow: hidden;
  display: grid;
  gap: 12px;
  width: 100%;
  min-width: 0;
  min-height: 0;
  padding: 0;
  margin: 0;
}
.card .field, .card .atf {
  width: 100%;
  min-width: 0;
  transition: border-color .18s, box-shadow .18s;
}
.card .field:focus, .card .atf:focus-within {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.atf {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 16px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--field);
  color: var(--muted);
}
.atf input {
  flex: 1;
  min-width: 0;
  background: none;
  border: 0;
  outline: 0;
  padding: 13px 0;
  color: var(--text);
  font-size: 16px;
}
.ust {
  display: block;
  min-height: 18px;
  text-align: center;
  color: #9fb0cf;
  line-height: 1.35;
}
.ust.good {
  color: #5ee6a8;
}
.ust.bad {
  color: #ff8a9a;
}
.pwf {
  position: relative;
  width: 100%;
}
.pwf .field {
  padding-right: 68px;
}
.pwt {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  padding: 8px 12px;
  border-radius: 12px;
  color: var(--muted);
  font-size: 13px;
}
.btn {
  position: relative;
  padding: 13px;
  border-radius: 16px;
  background: var(--grad);
  color: #fff;
  width: 100%;
  font-weight: 500;
}
.btn.alt {
  background: var(--field);
  color: var(--text);
}
.btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}
.btn.busy {
  color: transparent !important;
}
.btn.busy svg {
  opacity: 0;
}
.btn.busy::after {
  content: "";
  position: absolute;
  inset: 0;
  margin: auto;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.35);
  border-top-color: #fff;
  animation: spin .7s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
#google {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.link {
  color: var(--muted);
  text-decoration: underline;
}
.tag {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  margin: 0;
}
.foot {
  position: relative;
  z-index: 1;
  flex: 0 0 auto;
  margin: 0;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  letter-spacing: .3px;
}
.foot a {
  display: inline-block;
  padding: 6px 14px;
  font-family: 'Space Grotesk', 'Outfit', system-ui, sans-serif;
  font-weight: 500;
  letter-spacing: .4px;
  color: #9fb0cf;
  text-decoration: none;
}
.foot a:hover {
  color: var(--accent);
}
.auth .tag, .auth .link {
  color: #9fb0cf;
}

/* Modals, Sheets & Stories */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: grid;
  align-items: end;
  justify-items: center;
  z-index: 9;
  animation: mfade .2s ease both;
}
.sheet {
  width: 100%;
  max-width: 560px;
  max-height: 82dvh;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 18px 0 calc(16px + env(safe-area-inset-bottom, 0px));
  border-radius: 26px 26px 0 0;
  background: var(--panel);
  overflow: auto;
  animation: sup .26s cubic-bezier(.2,.8,.2,1) both;
  box-shadow: 0 -10px 40px rgba(0,0,0,.35);
}
.sheet::before {
  content: "";
  width: 40px;
  height: 4px;
  border-radius: 2px;
  background: var(--line);
  margin: -8px auto 2px;
  flex: none;
}
.sheet > b, .sheet > .field, .sheet > .pill, .sheet > .seg, .sheet > .opt, .sheet > small, .sheet > .btn, .sheet > .wp, .sheet > .prev, .sheet > .th-h, .sheet > .ginfo, .sheet > .emo {
  margin: 0 18px;
  width: auto;
}
.th-h {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.ginfo {
  display: grid;
  justify-items: center;
  gap: 6px;
  text-align: center;
}
.gname {
  font-size: 20px;
  font-weight: 600;
}
.emo {
  display: flex;
  justify-content: space-between;
}
.emo button {
  font-size: 26px;
  padding: 6px;
  border-radius: 12px;
}
.seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  border-radius: 16px;
  background: var(--field);
}
.seg button {
  padding: 9px;
  border-radius: 12px;
  color: var(--muted);
}
.seg button.on {
  background: var(--chip);
  color: var(--accent);
}
.opt {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
}
.sw {
  width: 48px;
  height: 28px;
  border-radius: 14px;
  background: var(--field);
  position: relative;
  flex: none;
}
.sw::after {
  content: "";
  position: absolute;
  left: 3px;
  top: 3px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #fff;
  transition: transform .2s;
}
.sw[aria-checked=true] {
  background: #2f84e0;
}
.sw[aria-checked=true]::after {
  transform: translateX(20px);
}
#toast {
  position: fixed;
  left: 50%;
  top: calc(70px + env(safe-area-inset-top, 0px));
  transform: translateX(-50%);
  padding: 10px 18px;
  border-radius: 99px;
  z-index: 12;
  white-space: nowrap;
  background: var(--panel);
  border: 1px solid var(--line);
  animation: mfade .2s ease both;
  box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
@keyframes mfade {
  from { opacity: 0; }
}
@keyframes sup {
  from { transform: translateY(28px); opacity: 0; }
}

/* Background Cosmic Art */
.art {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
  background: var(--wall, linear-gradient(180deg, #040814, #0a1330 70%, #101b45));
}
.art.a-none {
  display: none;
}
.art .st {
  position: absolute;
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  background: #fff;
  opacity: .2;
  animation: tw var(--d) ease-in-out var(--o) infinite;
}
@keyframes tw {
  50% { opacity: .95; transform: scale(1.5); }
}
.art .sh {
  position: absolute;
  width: 120px;
  height: 2px;
  border-radius: 2px;
  background: linear-gradient(270deg, rgba(255,255,255,0), #fff);
  opacity: 0;
  animation: sh var(--d) linear var(--o) infinite;
}
@keyframes sh {
  0% { opacity: 0; transform: translate(0,0) rotate(-35deg); }
  2% { opacity: 1; }
  12%, 100% { opacity: 0; transform: translate(-340px, 240px) rotate(-35deg); }
}
.art .pl {
  position: absolute;
  border-radius: 50%;
  animation: fl 16s ease-in-out infinite alternate;
}
@keyframes fl {
  to { transform: translate(-18px, 24px); }
}
.p1 {
  width: 84px;
  height: 84px;
  right: -8px;
  top: 12%;
  background: radial-gradient(circle at 32% 30%, #ffd9a0, #e58a3c 55%, #7a3a12);
  box-shadow: inset -10px -8px 18px rgba(0,0,0,.45), 0 0 30px rgba(255,160,70,.22);
}
.p2 {
  width: 46px;
  height: 46px;
  left: 8%;
  top: 60%;
  background: radial-gradient(circle at 30% 30%, #bfe4ff, #4d8fd6 60%, #1a3a6e);
  box-shadow: inset -6px -5px 12px rgba(0,0,0,.5);
  animation-duration: 13s;
  animation-delay: -4s;
}
.p3 {
  width: 110px;
  height: 110px;
  left: 52%;
  top: 74%;
  background: radial-gradient(circle at 30% 30%, #e3c9ff, #8c5ad8 58%, #3a1a6e);
  box-shadow: inset -10px -8px 20px rgba(0,0,0,.5);
  animation-duration: 19s;
  animation-delay: -8s;
}
.p3::after {
  content: "";
  position: absolute;
  left: -32%;
  right: -32%;
  top: 38%;
  height: 24%;
  border: 2px solid rgba(225,205,255,.5);
  border-radius: 50%;
  transform: rotate(-18deg);
}
.art .neb {
  position: absolute;
  width: 75%;
  height: 55%;
  border-radius: 50%;
  animation: fl 15s ease-in-out infinite alternate;
}
.n1 {
  left: -15%;
  top: 2%;
  background: radial-gradient(closest-side, rgba(110,80,255,.5), transparent);
}
.n2 {
  right: -20%;
  bottom: 0;
  background: radial-gradient(closest-side, rgba(30,200,170,.4), transparent);
  animation-delay: -6s;
}

/* Additional Components */
.prev {
  position: relative;
  overflow: hidden;
  background-color: var(--wall, var(--bg));
  background-image: var(--wallimg, none);
  background-size: cover;
  background-position: center;
  padding: 12px;
  border-radius: 16px;
  display: grid;
  gap: 6px;
  border: 1px solid var(--line);
}
.prev > .b {
  position: relative;
  z-index: 1;
  width: fit-content;
  max-width: 70%;
}
.prev .b.me {
  justify-self: end;
}
.sw-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 6px;
}
.dot {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 2px solid var(--line);
}
.dot.on {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 2px var(--panel);
}
.ac2 {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.lbl {
  display: grid;
  gap: 4px;
  width: 100%;
  color: var(--muted);
  font-size: 13px;
  text-align: left;
}
.avbtn {
  position: relative;
  border-radius: 50%;
}
.cam {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #2f84e0;
  color: #04121f;
  display: grid;
  place-items: center;
  border: 3px solid var(--bg);
}
.frame {
  position: relative;
  flex: none;
  width: 260px;
  height: 260px;
  margin: 4px auto;
  overflow: hidden;
  border-radius: 50%;
  touch-action: none;
  cursor: grab;
  background: #000;
  user-select: none;
}
.frame img {
  position: absolute;
  left: 0;
  top: 0;
  max-width: none;
  pointer-events: none;
  transform-origin: 0 0;
}
.frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.55);
  pointer-events: none;
}
.zoom {
  width: calc(100% - 36px);
  margin: 4px 18px;
  accent-color: var(--accent);
}
.quote {
  display: grid;
  gap: 1px;
  padding: 5px 8px;
  margin-bottom: 4px;
  border-left: 3px solid var(--accent);
  border-radius: 6px;
  background: rgba(0,0,0,.22);
  font-size: 13px;
}
.quote span {
  opacity: .85;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 240px;
}
.rx {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 3px;
  clear: both;
}
.rxc {
  padding: 1px 8px;
  border-radius: 99px;
  background: rgba(255,255,255,.1);
  font-size: 13px;
}
.rxc.on {
  background: rgba(83,166,250,.3);
}
.vm {
  width: 220px;
  max-width: 100%;
  height: 40px;
  display: block;
  margin: 2px 0;
}
.poll {
  display: grid;
  gap: 6px;
  min-width: 220px;
  margin-bottom: 2px;
}
.pop {
  position: relative;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 10px;
  background: rgba(255,255,255,.08);
  overflow: hidden;
  text-align: left;
}
.pop i {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  background: rgba(83,166,250,.28);
}
.pop span, .pop small {
  position: relative;
}
.pop.on {
  outline: 1px solid var(--accent);
}
.rbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: var(--panel);
  border-left: 3px solid var(--accent);
}
.rbar small {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.annote {
  flex: 0 0 auto;
  padding: 14px;
  text-align: center;
  color: var(--muted);
  background: var(--panel);
}
.jump {
  position: absolute;
  right: 16px;
  bottom: 72px;
  z-index: 3;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: 0 4px 14px rgba(0,0,0,.4);
  display: grid;
  place-items: center;
}
.jump .ic {
  transform: rotate(-90deg);
}
.jump[data-n]:not([data-n=""])::after {
  content: attr(data-n);
  position: absolute;
  top: -6px;
  right: -4px;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 10px;
  background: var(--accent);
  color: var(--onaccent);
  font-size: 12px;
  font-weight: 600;
  display: grid;
  place-items: center;
}
.ib.rec {
  color: #ff5d6c;
  animation: rp 1s infinite;
}
@keyframes rp {
  50% { opacity: .4; }
}
.lock {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: var(--bg);
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 16px;
  text-align: center;
}
.dots {
  display: flex;
  gap: 12px;
}
.dots i {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid var(--muted);
}
.dots i.on {
  background: var(--accent);
  border-color: var(--accent);
}
.pad {
  display: grid;
  grid-template-columns: repeat(3, 72px);
  gap: 12px;
}
.pad button {
  height: 72px;
  border-radius: 50%;
  background: var(--panel);
  font-size: 24px;
}
.ring {
  padding: 3px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  flex: none;
}
.ring.no {
  border-color: transparent;
}
.qr {
  background: #fff;
  border-radius: 16px;
  padding: 10px;
  width: 220px;
}
.qr svg {
  width: 100%;
  height: auto;
  display: block;
}
.pcard {
  margin: 0 16px;
  padding: 16px;
  border-radius: 22px;
  background: var(--panel);
  display: grid;
  gap: 10px;
  justify-items: center;
}
.pcard.list {
  padding: 4px 0;
  gap: 0;
  justify-items: stretch;
}
.pcard.list .row {
  padding: 12px 16px;
}
.pcard .lbl {
  width: 100%;
}
.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  width: 100%;
}
.stats div {
  min-width: 0;
  padding: 10px 4px;
  border-radius: 16px;
  background: var(--panel);
  text-align: center;
  font-size: clamp(10.5px, 3vw, 14px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.phead .stats div {
  background: var(--field);
}
.stats b {
  display: block;
  font-size: 20px;
  font-weight: 500;
}

/* Stories Modal */
.modal.story {
  background: rgba(0,0,0,.92);
  display: flex !important;
  justify-content: center;
  align-items: stretch;
  padding: 0;
  width: 100%;
  max-width: 100vw;
  overflow: hidden;
}
.modal.story .sbox {
  position: relative;
  flex: 0 1 440px;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  height: 100%;
  margin: 0 auto;
  background: #000;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr) auto !important;
  overflow: hidden;
}
.sbox.view1 {
  grid-template-rows: auto minmax(0, 1fr) auto !important;
}
.sbars {
  display: flex;
  gap: 4px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 6px;
  width: 100%;
}
.sbars i {
  flex: 1;
  height: 3px;
  border-radius: 2px;
  background: rgba(255,255,255,.3);
  position: relative;
  overflow: hidden;
}
.sbars i span {
  position: absolute;
  inset: 0;
  background: #fff;
  transform: scaleX(0);
  transform-origin: left;
}
.sbars i.done span {
  transform: scaleX(1);
}
.sbars i.cur span {
  animation: fill 5s linear forwards;
}
.hold .sbars i.cur span {
  animation-play-state: paused;
}
@keyframes fill {
  to { transform: scaleX(1); }
}
.shead {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px 6px 12px;
  color: #fff;
  width: 100%;
}
.shead .ib {
  flex: none;
  color: #fff;
  font-size: 26px;
}
.sbox > p {
  margin: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  font-size: 26px;
  text-align: center;
  color: #fff;
  min-height: 0;
  min-width: 0;
  overflow: hidden;
}
.sbox > img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
  min-height: 0;
  min-width: 0;
  overflow: hidden;
}
.sfoot {
  position: relative;
  z-index: 2;
  display: grid;
  gap: 8px;
  padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(transparent, rgba(0,0,0,.85) 40%);
  width: 100%;
}
.srow {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
}
.sin {
  width: 0;
  flex: 1 1 auto;
  min-width: 0;
  padding: 11px 16px;
  border-radius: 99px;
  border: 1px solid rgba(255,255,255,.35);
  background: rgba(0,0,0,.35);
  color: #fff;
  outline: 0;
}
.sin::placeholder {
  color: #cfd6e6;
}
.sact {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,.14);
  color: #fff;
  flex: none;
  font-size: 0;
}
.sact svg {
  display: block;
}
.sact.on {
  color: #ff5d73;
}
.sact.on svg {
  fill: #ff5d73;
}
.sact.go {
  background: var(--grad);
}
.seen {
  color: #fff;
  padding: 8px 14px;
  border-radius: 99px;
  background: rgba(255,255,255,.14);
  justify-self: center;
}
.seenlist {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  max-height: 60%;
  overflow: auto;
  background: var(--panel);
  color: var(--text);
  border-radius: 22px 22px 0 0;
  padding: 14px 0;
  z-index: 3;
}
.seenlist .t {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 18px 6px;
}
.fly {
  position: absolute;
  bottom: 110px;
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  line-height: 1;
  font-size: 34px;
  animation: fly 1s ease-out forwards;
  pointer-events: none;
  z-index: 2;
}
@keyframes fly {
  to { transform: translateY(-170px) scale(1.4); opacity: 0; }
}
.tray {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding: 4px 18px 10px;
  scrollbar-width: none;
}
.tray::-webkit-scrollbar {
  display: none;
}
.tr {
  position: relative;
  display: grid;
  justify-items: center;
  gap: 6px;
  flex: none;
  width: 70px;
}
.tr small {
  max-width: 70px;
  text-align: center;
}
.tplus {
  position: absolute;
  top: 46px;
  right: 4px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent);
  color: #04121f;
  border: 2px solid var(--bg);
  font-size: 15px;
  line-height: 1;
  display: grid;
  place-items: center;
}

/* Search & Pin Bars in Conversation */
.csbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px 6px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.csbar .field {
  flex: 1;
  min-width: 0;
  padding: 8px 14px;
}
.csbar .ib {
  flex: none;
}
.csbar .ib.up svg {
  transform: rotate(90deg);
}
.csbar .ib.dn svg {
  transform: rotate(-90deg);
}
.pinbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 14px;
  border-bottom: 1px solid var(--line);
  color: var(--accent);
  background: var(--panel);
}
.pintx {
  display: grid;
  text-align: left;
  min-width: 0;
  flex: 1;
}
.pintx b {
  font-size: 13px;
}
.pintx span {
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;

.stkgrid button {

@keyframes popin {

.b.pop {

}
.row.danger b {

}
.unx {

}
.unart {
  background: linear-gradient(180deg, #040814, #0a1330 70%, #101b45);
}
.pill, .btn, .send, .fab, .ib {

<script>
const $ = s => document.querySelector(s);
const el = (t, a = {}, ...c) => {
  const e = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    k === 'class' ? e.className = v : k.startsWith('on') ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v);
  }
  c.flat().forEach(x => x != null && x !== false && e.append(x));
  return e;
};

const IC = {
  chat: '<path d="M4 5h16v11H9l-5 4V5z"/><path d="M8 10h8"/>',
  friends: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.4.3 4 2.2 4 5"/>',
  comm: '<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>',
  profile: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/>',
  set: '<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/>',
  send: '<path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>',
  clip: '<path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  back: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
  dots: '<circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/>',
  pin: '<path d="M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6zM12 14v7"/>',
  compose: '<rect x="3" y="4" width="18" height="16" rx="4"/><path d="M12 9v6M9 12h6"/>',
  theme: '<circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="10" r="1.2"/><circle cx="12" cy="7.5" r="1.2"/><circle cx="15.5" cy="10" r="1.2"/><path d="M12 21a2.2 2.2 0 0 1 0-4.4h1.4a2.4 2.4 0 0 0 2.4-2.4"/>',
  smile: '<circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.5 2 3.5 2 3.5-2 3.5-2"/><circle cx="9" cy="9.5" r="1" fill="currentColor"/><circle cx="15" cy="9.5" r="1" fill="currentColor"/>',
  cam: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
  fw: '<path d="M13 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/>'
};

const ic = (n, s = 24) => {
  const e = document.createElement('span');
  e.className = 'ic';
  e.innerHTML = '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[n] + '</svg>';
  return e;
};

const toast = m => {
  const t = $('#toast');
  t.textContent = m;
  t.hidden = false;
  clearTimeout(t.h);
  t.h = setTimeout(() => t.hidden = true, 2800);
};

const U = {
  me: { n: 'You' },
  maya: { n: 'Maya', on: 1 },
  jamal: { n: 'Jamal', on: 1 },
  amara: { n: 'Amara' },
  leo: { n: 'Leo', on: 1 },
  nova: { n: 'Nova', on: 1 },
  zara: { n: 'Zara' },
  kai: { n: 'Kai', on: 1 },
  ivy: { n: 'Ivy' }
};

const hue = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) & 0xffff, 7) % 360;
const av = (n, on, s, img) => el(
  'div',
  { class: 'av' + (on ? ' on' : ''), style: '--h:' + hue(n) + (s ? ';--s:' + s + 'px' : '') },
  img ? el('img', { src: img, alt: '', style: 'position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover' }) : n[0].toUpperCase()
);

const now = Date.now();
const mk = (f, b, min, o = {}) => ({ id: Math.random(), f, b, t: now - min * 6e4, read: f === 'me' && min > 5, ...o });

let F = new Set(['maya', 'jamal', 'amara', 'leo']);
let R = ['nova', 'zara'];
let S = new Set();
let P = { name: 'Cosmicpioneer', bio: 'Building things under the stars.' };
let ST = { notif: 1, online: 1, receipts: 1 };
let tab = 'chats', flt = 'all', cur = null, typer = '';

let C = [
  { id: 1, g: 0, pin: 1, m: ['maya'], unread: 1, msgs: [mk('maya', 'Did you see the new theme?', 70), mk('me', 'Yes, the stars in the background are a nice touch', 69), mk('maya', 'Sending a screenshot', 66)] },
  { id: 2, g: 1, name: 'Space crew', m: ['leo', 'jamal', 'amara'], unread: 0, adm: ['me', 'leo'], msgs: [mk('leo', 'Launch is Friday', 130), mk('jamal', 'I’ll bring the snacks', 125), mk('me', 'Count me in', 120, { read: 1 }), mk('amara', 'Nice, got it', 110)] },
  { id: 3, g: 0, m: ['jamal'], unread: 0, msgs: [mk('jamal', 'Ready for the demo?', 1500), mk('me', '', 1490, { img: 1, read: 1 })] }
];

let K = [
  { id: 101, g: 1, k: 1, name: 'Night sky watchers', desc: 'Share photos and plan stargazing nights', n: 2400, joined: 1, m: ['kai', 'ivy', 'leo'], unread: 0, adm: ['kai'], msgs: [mk('kai', 'Clear skies tonight', 90), mk('ivy', 'Jupiter is bright', 80)] },
  { id: 102, g: 1, k: 1, name: 'Indie web builders', desc: 'Show side projects and get feedback', n: 860, joined: 0, m: ['kai', 'nova'], unread: 0, adm: ['nova'], msgs: [mk('nova', 'Just shipped my landing page', 200)] },
  { id: 103, g: 1, k: 1, name: 'Cosmic photography', desc: 'Astro photos, gear and editing tips', n: 1300, joined: 0, m: ['ivy', 'zara'], unread: 0, adm: ['ivy'], msgs: [mk('ivy', 'Edited this nebula shot', 300)] }
];

const find = id => C.find(c => c.id === id) || K.find(c => c.id === id);
const title = c => c.g ? c.name : c.self ? (P.name || 'Cosmicpioneer') + ' (You)' : U[c.m[0]].n;
const last = c => c.msgs[c.msgs.length - 1];
const tm = t => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true }).toLowerCase();
const fmtN = n => n >= 1000 ? (n / 1000).toFixed(1).replace('.0', '') + 'k' : n;
const btn = (l, fn, alt) => el('button', { class: 'pill' + (alt ? ' alt' : ''), onclick: e => { e.stopPropagation(); fn(e); } }, l);
const sec = (t, a) => a.length ? [el('div', { class: 'sec' }, t), ...a] : [];
const row = (a, t, s, right, fn) => {
  const body = [a, el('div', { class: 'g' }, el('b', {}, t), el('div', { class: 'sub' }, s || '')), right || null];
  return fn ? el('button', { class: 'row', onclick: fn }, ...body) : el('div', { class: 'row' }, ...body);
};

const prev = m => {
  if (!m) return '';
  if (m.del) return m.del === 'admin' ? 'Deleted by admin' : 'Message deleted';
  const t = m.doc ? '📄 ' + m.doc.name : m.stk ? 'Sticker' : m.imgs ? 'Photos' : m.once ? 'View-once photo' : m.img ? 'Photo' : m.au ? 'Voice message' : m.poll ? 'Poll: ' + m.poll.q : m.ev ? 'Event: ' + m.ev.t : m.b;
  return [
    m.f === 'me' ? el('span', { class: 'tk' + (m.read && ST.receipts ? ' r' : '') }, m.read && ST.receipts ? '✓✓' : '✓') : null,
    (m.f !== 'me' && m.g ? U[m.f].n + ': ' : '') + t
  ];
};

const rowChat = c => press(c, row(
  av(title(c), !c.g && U[c.m[0]].on, 0, c.img),
  title(c),
  c.draft ? [el('span', { style: 'color:var(--accent)' }, 'Draft: '), c.draft] : prev(last(c)),
  el('div', { class: 'rt' + (c.unread ? ' u' : '') }, el('small', {}, tm(last(c).t)), c.unread ? el('span', { class: 'badge' + (c.mute ? ' mut' : '') }, c.unread) : c.pin ? ic('pin', 16) : null),
  () => open(c.id)
));

const rowComm = k => k.joined
  ? row(av(k.name, 0, 0, k.img), k.name, k.desc, el('div', { class: 'rt' + (k.unread ? ' u' : '') }, el('small', {}, fmtN(k.n) + ' members'), k.unread ? el('span', { class: 'badge' }, k.unread) : null), () => open(k.id))
  : row(av(k.name, 0, 0, k.img), k.name, fmtN(k.n) + ' members · ' + (k.approve ? 'Approval needed · ' : '') + k.desc, k.approve ? btn(k.pend ? 'Requested' : 'Request', () => { if (k.pend) return; k.pend = 1; toast('Request sent to the admins'); render(); setTimeout(() => { k.pend = 0; k.joined = 1; k.n++; toast('You were approved to join ' + k.name); render(); }, 5000); }, !!k.pend) : btn('Join', () => { k.joined = 1; k.n++; toast('Joined ' + k.name); render(); }));

const rowPerson = k => F.has(k)
  ? row(av(U[k].n, U[k].on), U[k].n, U[k].on ? 'Online' : 'Offline', btn('Message', () => dm(k)))
  : row(av(U[k].n), U[k].n, S.has(k) ? 'Request sent' : 'Suggested for you', btn(S.has(k) ? 'Requested' : 'Add friend', () => { S.add(k); toast('Friend request sent'); render(); }, S.has(k)));

function dm(k) {
  let c = C.find(x => !x.g && x.m[0] === k);
  if (!c) {
    c = { id: Date.now(), g: 0, m: [k], unread: 0, msgs: [mk(k, 'Hi! Say hello', 0)] };
    C.push(c);
  }
  tab = 'chats';
  open(c.id);
}

/* Shell */
$('#sico').append(ic('search', 22));
$('#set').append(ic('set'));
$('#menu').append(ic('dots'));
$('#back').append(ic('back', 22));
$('#emojibtn').append(ic('smile', 22));
$('#attach').append(ic('clip', 21));
$('#cambtn').append(ic('cam', 21));
$('#send').append(ic('mic', 20));

const TABS = [['chats', 'chat', 'Chats'], ['friends', 'friends', 'Friends'], ['comm', 'comm', 'Communities'], ['profile', 'profile', 'Profile']];
$('#tabs').replaceChildren(...TABS.map(([k, i, l]) => el('button', { class: 'tab', 'data-k': k, onclick: () => go(k) }, el('span', { class: 'tp' }, ic(i)), l)));

const HS = { chats: 'chats', friends: 'friends', comm: 'communities', profile: 'profile' };
function go(k) {
  const hh = HS[k], cu = location.hash.slice(1) || 'chats';
  $('#q').value = '';
  if (hh === cu) return render();
  if (hh === 'chats') return history.back();
  cu === 'chats' ? location.hash = hh : location.replace('#' + hh);
}

let AFTER = null;
function closeSheet(fn) {
  if (location.hash === '#sheet') {
    AFTER = fn || null;
    history.back();
  } else {
    document.querySelectorAll('.modal').forEach(m => m.remove());
    if (fn) fn();
  }
}

function resetTheme() {
  if (SC != null) {
    find(SC).theme = null;
    PR.per[SC] = undefined;
  } else {
    PR.wall = PR.img = PR.me = null;
    PR.art = 'none';
  }
  applyPrefs();
  refreshArt();
  document.querySelectorAll('.modal').forEach(m => m.remove());
  chatTheme(SC != null ? SC : undefined, SC != null);
}

function route() {
  if (location.hash === '#sheet') {
    if (!document.querySelector('.modal')) history.back();
    return;
  }
  route0();
  if (AFTER) {
    const f = AFTER;
    AFTER = null;
    f();
  }
}

function route0() {
  document.querySelectorAll('.modal').forEach(m => m.remove());
  if ($('#app').hidden) return;
  const h = location.hash.slice(1), T = { friends: 'friends', communities: 'comm', profile: 'profile' };
  if (h === 'chat') {
    if (cur === null) location.replace('#');
    return;
  }
  if (cur !== null) closeConv();
  tab = T[h] || 'chats';
  $('#q').value = '';
  render();
}
addEventListener('hashchange', route);

function render() {
  const q = $('#q').value.trim(), v = $('#view');
  const un = C.reduce((a, c) => a + c.unread, 0) + K.reduce((a, c) => a + (c.joined ? c.unread : 0), 0);
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('on', t.dataset.k === tab && !q);
    const p = t.querySelector('.tp .badge');
    p && p.remove();
    if (t.dataset.k === 'chats' && un) t.querySelector('.tp').append(el('span', { class: 'badge' }, un));
  });
  $('#chips').hidden = !(tab === 'chats' && !q);
  $('#fab').hidden = !(tab === 'chats' || tab === 'comm') || !!q;
  $('#fab').replaceChildren(ic('compose', 28));
  $('#fab').onclick = tab === 'comm' ? create : newChat;

function swipe(rw, b, m) {
  let x0 = 0, y0 = 0, dx = 0, on = false;
  const back = () => { b.style.transition = 'transform .2s ease'; b.style.transform = ''; on = false; };
  rw.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; on = false; }, { passive: true });
  rw.addEventListener('touchmove', e => {
    const t = e.touches[0], mx = t.clientX - x0, my = t.clientY - y0;
    if (!on && mx > 12 && mx > Math.abs(my) * 1.5) on = true;
    if (!on) return;
    dx = Math.min(mx, 80);
    b.style.transition = 'none';
    b.style.transform = 'translateX(' + dx + 'px)';
    rw.classList.toggle('arm', dx > 56);
  }, { passive: true });
  rw.addEventListener('touchend', () => {
    const go = on && dx > 56;
    rw.classList.remove('arm');
    back();
    if (go) {
      if (navigator.vibrate) try { navigator.vibrate(10); } catch (e) {}
      startReply(m);
    }
  });
  rw.addEventListener('touchcancel', () => { rw.classList.remove('arm'); back(); });
}

function framer(file, done) {
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => {
    const SZ = 260, min = Math.max(SZ / im.width, SZ / im.height);
    let sc = min, x = (SZ - im.width * sc) / 2, y = (SZ - im.height * sc) / 2;
    const img = el('img', { src: url, alt: '', draggable: 'false' });
    const place = () => {
      x = Math.min(0, Math.max(SZ - im.width * sc, x));
      y = Math.min(0, Math.max(SZ - im.height * sc, y));
      img.style.width = im.width * sc + 'px';
      img.style.height = im.height * sc + 'px';
      img.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    };
    const box = el('div', { class: 'frame' }, img);
    place();
    let drag = null;
    box.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY }; box.setPointerCapture(e.pointerId); };
    box.onpointermove = e => { if (!drag) return; x += e.clientX - drag.x; y += e.clientY - drag.y; drag = { x: e.clientX, y: e.clientY }; place(); };
    box.onpointerup = box.onpointercancel = () => { drag = null; };
    const z = el('input', { class: 'zoom', type: 'range', min: '1', max: '3', step: '0.01', value: '1', 'aria-label': 'Zoom' });
    z.oninput = () => {
      const cx = (SZ / 2 - x) / sc, cy = (SZ / 2 - y) / sc;
      sc = min * (+z.value);
      x = SZ / 2 - cx * sc;
      y = SZ / 2 - cy * sc;
      place();
    };
    sheet(
      el('b', {}, 'Frame your photo'),
      box,
      el('small', { style: 'text-align:center' }, 'Drag to move, use the slider to zoom'),
      z,
      el('div', { class: 'wp ac2' },
        btn('Save photo', () => {
          const c = document.createElement('canvas');
          c.width = c.height = 512;
          c.getContext('2d').drawImage(im, -x / sc, -y / sc, SZ / sc, SZ / sc, 0, 0, 512, 512);
          closeSheet(() => done(c.toDataURL('image/jpeg', .88)));
        }),
        btn('Cancel', () => closeSheet(), 1)
      )
    );
  };
  im.src = url;
}

  const b = el('button', { class: 'sw', role: 'switch', 'aria-checked': String(!!on), onclick: () => {
    const v = b.getAttribute('aria-checked') !== 'true';
    b.setAttribute('aria-checked', String(v));
    fn(v);
  } });
  return b;
};

const PR = { wall: null, img: null, me: null, art: 'none', per: {} };
let PREV = null;
try { Object.assign(PR, JSON.parse(localStorage.getItem('prefs') || '{}')); } catch (e) {}

function applyPrefs() {
  const s = document.documentElement.style;
  PR.wall ? s.setProperty('--wall', PR.wall) : s.removeProperty('--wall');
  PR.img ? s.setProperty('--wallimg', 'linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),url("' + PR.img + '")') : s.removeProperty('--wallimg');
  PR.me ? s.setProperty('--meb', PR.me) : s.removeProperty('--meb');
  try { localStorage.setItem('prefs', JSON.stringify(PR)); } catch (e) {}
}
PR.img = null;
applyPrefs();

const ARTS = [['none', 'None'], ['stars', 'Twinkling stars'], ['shoot', 'Shooting stars'], ['planets', 'Planets'], ['nebula', 'Nebula']];
function art(k) {
  const d = el('div', { class: 'art a-' + k });
  if (k === 'none') return d;
  let s = 7;
  const r = () => (s = s * 16807 % 2147483647) / 2147483647;
  for (let i = 0; i < (k === 'stars' ? 70 : 40); i++) {
    d.append(el('span', { class: 'st', style: 'left:' + (r() * 100).toFixed(1) + '%;top:' + (r() * 100).toFixed(1) + '%;--s:' + (r() * 1.8 + 1).toFixed(1) + 'px;--d:' + (r() * 3 + 2).toFixed(1) + 's;--o:-' + (r() * 5).toFixed(1) + 's' }));
  }
  if (k === 'shoot') {
    for (let i = 0; i < 3; i++) {
      d.append(el('span', { class: 'sh', style: 'top:' + (r() * 35).toFixed(0) + '%;left:' + (45 + r() * 50).toFixed(0) + '%;--d:' + (8 + i * 2) + 's;--o:-' + (i * 3) + 's' }));
    }
  }
  if (k === 'planets') d.append(el('span', { class: 'pl p1' }), el('span', { class: 'pl p2' }), el('span', { class: 'pl p3' }));
  if (k === 'nebula') d.append(el('span', { class: 'neb n1' }), el('span', { class: 'neb n2' }));
  return d;
}

let SC = null;
const tg = () => SC != null ? (find(SC).theme || { wall: PR.wall, me: PR.me, art: PR.art }) : PR;
const eff = () => {
  const c = cur != null && find(cur);
  return c && c.theme ? c.theme : PR;
};

function paint(e, t, x) {
  const s = e.style;
  t.wall ? s.setProperty('--wall', t.wall) : x ? s.setProperty('--wall', 'initial') : s.removeProperty('--wall');
  t.me ? s.setProperty('--meb', t.me) : x ? s.setProperty('--meb', 'initial') : s.removeProperty('--meb');
}

function setT(k, v) {
  if (SC != null) {
    const c = find(SC);
    c.theme = c.theme || { wall: PR.wall, me: PR.me, art: PR.art };
    c.theme[k] = v;
    PR.per[SC] = c.theme;
  } else {
    PR[k] = v;
  }
  applyPrefs();
  refreshArt();
}

const scopeSeg = cid => {
  const b = (l, on, sc) => el('button', { class: on ? 'on' : '', onclick: () => { document.querySelectorAll('.modal').forEach(m => m.remove()); chatTheme(cid, sc); } }, l);
  return el('div', { class: 'seg' }, b('This chat', SC != null, true), b('All chats', SC == null, false));
};

function refreshArt() {
  const t = eff(), a = art(t.art);
  a.id = 'art';
  $('#art').replaceWith(a);
  t === PR ? paint($('#conv'), {}) : paint($('#conv'), t, true);
  if (PREV) {
    const o = PREV.querySelector('.art');
    o && o.replaceWith(art(tg().art));
    paint(PREV, tg(), SC != null);
  }
}
refreshArt();
{
  const aa = art('shoot');
  aa.id = 'authart';
  $('#authart').replaceWith(aa);
}

function shrink(f, max, cb) {
  const im = new Image();
  im.onload = () => {
    const k = Math.min(1, max / Math.max(im.width, im.height));
    const c = document.createElement('canvas');
    c.width = Math.round(im.width * k);
    c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(im.src);
    cb(c.toDataURL('image/jpeg', .72));
  };
  im.src = URL.createObjectURL(f);
}

const swatches = (list, curv, fn) => el('div', { class: 'sw-row' }, ...list.map(c => el('button', {
  class: 'dot' + (curv === c ? ' on' : ''),
  style: 'background:' + (c || 'var(--bg)'),
  'aria-label': 'Colour ' + (c || 'default'),
  onclick: e => {
    fn(c);
    [...e.currentTarget.parentNode.children].forEach(x => x.classList.remove('on'));
    e.currentTarget.classList.add('on');
  }
})));

const settings = () => sheet(
  el('b', {}, 'Settings'),
  el('div', { class: 'opt' }, 'Light theme', sw(document.documentElement.dataset.theme === 'light', v => { document.documentElement.dataset.theme = v ? 'light' : 'dark'; try { localStorage.setItem('theme', v ? 'light' : 'dark'); } catch (e) {} })),
  el('div', { class: 'opt' }, 'Notifications', sw(ST.notif, v => ST.notif = v)),
  el('div', { class: 'opt' }, 'Show when I’m online', sw(ST.online, v => ST.online = v)),
  el('div', { class: 'opt' }, 'Read receipts', sw(ST.receipts, v => { ST.receipts = v; render(); })),
  el('div', { class: 'opt' }, 'App lock (PIN)', sw(!!LOCK, v => { document.querySelectorAll('.modal').forEach(m => m.remove()); v ? showLock('set', () => settings()) : showLock('off', () => settings()); })),
  btn('Chat theme', () => { document.querySelectorAll('.modal').forEach(m => m.remove()); chatTheme(); }, 1)
);

const chatTheme = (cid, sc) => sheet(
  (SC = (typeof cid === 'number' && sc !== false) ? cid : null, el('div', { class: 'th-h' }, el('b', {}, 'Chat theme'), btn('Reset', resetTheme, 1))),
  typeof cid === 'number' ? scopeSeg(cid) : el('small', {}, 'Applies to all your chats'),
  (PREV = el('div', { class: 'prev' }, art(tg().art), el('div', { class: 'b th' }, 'Hello there'), el('div', { class: 'b me' }, 'Looks great')), paint(PREV, tg(), SC != null), PREV),
  el('div', { class: 'wp' }, el('small', {}, 'Background art'), el('div', { class: 'sw-row' }, ...ARTS.map(([k, l]) => el('button', { class: 'chip' + (tg().art === k ? ' on' : ''), onclick: e => { setT('art', k); [...e.currentTarget.parentNode.children].forEach(x => x.classList.remove('on')); e.currentTarget.classList.add('on'); } }, l)))),
  el('div', { class: 'wp' }, el('small', {}, 'Wallpaper colour'), swatches([null, '#000000', '#0a1a33', '#0b1f1a', '#1b1030', '#1e1610'], tg().wall, c => setT('wall', c))),
  el('div', { class: 'wp' }, el('small', {}, 'My message colour'), swatches([null, '#0f5a52', '#3b2f73', '#6b2338', '#1f4d2e', '#33414f'], tg().me, c => setT('me', c))),
  el('div', { class: 'wp ac2' }, btn(SC != null ? 'Use all-chats theme' : 'Reset chat style', resetTheme, 1))
);

$('#set').onclick = settings;
$('#menu').onclick = () => {
  const m = sheet(
    el('b', {}, 'More'),
    row(ic('compose'), 'New group or community', '', null, () => { m.remove(); create(); }),
    row(ic('chat'), 'Chat theme', '', null, () => { m.remove(); chatTheme(); }),
    row(ic('set'), 'Settings', '', null, () => { m.remove(); settings(); }),
    row(ic('profile'), 'Sign out', '', null, () => { m.remove(); signOut(); })
  );
};

/* Auth & Fast Lag-Free Input Handling */
let mode = 'in';
$('#toggle').onclick = () => {
  mode = mode === 'in' ? 'up' : 'in';
  $('#afold').classList.toggle('open', mode === 'up');
  $('#afold').inert = mode === 'in';
  $('#email').placeholder = mode === 'in' ? 'Your email or user ID' : 'Email';
  $('#pw').autocomplete = mode === 'in' ? 'current-password' : 'new-password';
  if (mode === 'up') aCheck();
  $('#go').textContent = mode === 'in' ? 'Sign in' : 'Create account';
  $('#toggle').textContent = mode === 'in' ? 'New here? Create an account' : 'Have an account? Sign in';
};

const TAKEN = new Set(['admin', 'support', 'help', 'root', 'cosmic', 'cosmicchat', 'cosmic_you', 'maya', 'jamal', 'amara', 'leo', 'nova', 'zara', 'kai', 'ivy']);
const unOk = v => /^[a-z][a-z0-9_]{2,19}$/.test(v);
const unClean = v => v.trim().toLowerCase().replace(/^@/, '').replace(/[^a-z0-9_]/g, '');
const unSug = n => {
  const b = n.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 16);
  return !b ? '' : /^[a-z]/.test(b) ? b : 'u_' + b;
};

let AUOK = false, aut;
async function checkUsernameNow(v) {
  const st = $('#aust');
  AUOK = false;
  if (!v) {
    st.textContent = 'Choose a unique username. Friends will find you by it.';
    st.className = 'ust';
    return false;
  }
  if (!unOk(v)) {
    st.textContent = 'Use 3 to 20 letters, numbers or underscores. Start with a letter.';
    st.className = 'ust bad';
    return false;
  }
  if (TAKEN.has(v)) {
    st.textContent = '@' + v + ' is reserved.';
    st.className = 'ust bad';
    return false;
  }
  st.textContent = 'Checking…';
  st.className = 'ust';
  try {
    const { data, error } = await db.rpc('is_username_available', { p_username: v });
    if (error) throw error;
    if (unClean($('#auser').value) !== v) return false;
    if (data !== true) {
      st.textContent = '@' + v + ' is already taken.';
      st.className = 'ust bad';
      return false;
    }
    st.textContent = '@' + v + ' is available.';
    st.className = 'ust good';
    AUOK = true;
    return true;
  } catch (err) {
    st.textContent = 'Username check error: ' + (err.message || 'Please try again.');
    st.className = 'ust bad';
    console.error('Username availability error:', err);
    return false;
  }
}
function aCheck() {
  const v = unClean($('#auser').value), st = $('#aust');
  AUOK = false;
  clearTimeout(aut);
  if (!v) {
    st.textContent = 'Choose a unique username. Friends will find you by it.';
    st.className = 'ust';
    return;
  }
  if (!unOk(v)) {
    st.textContent = 'Use 3 to 20 letters, numbers or underscores. Start with a letter.';
    st.className = 'ust bad';
    return;
  }
  st.textContent = 'Checking username availability…';
  st.className = 'ust';
  aut = setTimeout(() => checkUsernameNow(v), 300);
}

$('#auser').oninput = e => {
  if (e.isComposing) return;
  $('#auser').dataset.t = 1;
  const cleaned = $('#auser').value.toLowerCase().replace(/[^a-z0-9_]/g, '');
  if ($('#auser').value !== cleaned) $('#auser').value = cleaned;
  aCheck();
};

$('#name').oninput = e => {
  if (e.isComposing) return;
  if (!$('#auser').dataset.t) {
    const sug = unSug($('#name').value);
    if ($('#auser').value !== sug) $('#auser').value = sug;
    aCheck();
  }
};

function afterAuth(kind) {
  // Kept as a compatibility hook; real session handling is below.
  return enter();
}

const supabaseConfig = window.COSMIC_CHAT_CONFIG || {};
if (!supabaseConfig.SUPABASE_URL || !supabaseConfig.SUPABASE_PUBLISHABLE_KEY) {
  toast('Supabase configuration is missing. Check config.js.');
}
const db = window.supabase.createClient(
  supabaseConfig.SUPABASE_URL,
  supabaseConfig.SUPABASE_PUBLISHABLE_KEY
);

async function loadMyProfile(user) {
  const { data, error } = await db.from('profiles')
    .select('id, username, display_name, avatar_url, bio')
    .eq('id', user.id)
    .maybeSingle();
  if (error) throw error;
  if (!data) throw new Error('Your profile is not ready yet. Please contact support.');
  P.id = data.id;
  P.user = data.username;
  P.name = data.display_name || data.username;
  P.email = user.email || '';
  P.avatar = data.avatar_url || '';
}

async function handleAuthSubmit() {
  const go = $('#go'), google = $('#google');
  if (go.disabled) return;
  const email = $('#email').value.trim().toLowerCase();
  const password = $('#pw').value;
  const isSignup = mode === 'up';

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    return toast('Enter a valid email address.');
  }
  if (!password || password.length < 8) {
    return toast('Password must be at least 8 characters.');
  }
  if (isSignup) {
    const displayName = $('#name').value.trim();
    const username = unClean($('#auser').value);
    if (!displayName) return toast('Enter your name.');
    if (!unOk(username)) return toast('Choose a valid username.');
    // Always perform a fresh server-side check on submit. Do not wait for
    // the debounced input check or rely on a possibly stale AUOK flag.
    const available = await checkUsernameNow(username);
    if (!available) {
      return toast('Username is not available or could not be checked. Read the message below the username field.');
    }
  }

  go.disabled = google.disabled = true;
  go.classList.add('busy');
  try {
    if (isSignup) {
      const username = unClean($('#auser').value);
      const displayName = $('#name').value.trim();
      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: window.location.href,
          data: { username, display_name: displayName }
        }
      });
      if (error) throw error;
      if (data.session && data.user) {
        await loadMyProfile(data.user);
        enter();
        toast('Welcome to COSMIC CHAT!');
      } else {
        toast('Account created. Check your email to confirm, then sign in.');
      }
    } else {
      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await loadMyProfile(data.user);
      enter();
      toast('Welcome back, ' + P.name + '!');
    }
  } catch (err) {
    console.error('Authentication error:', err);
    toast(err.message || 'Authentication failed. Please try again.');
  } finally {
    go.disabled = google.disabled = false;
    go.classList.remove('busy');
  }
}

$('#google').onclick = () => toast('Google sign-in will be enabled after OAuth configuration.');
$('#go').onclick = handleAuthSubmit;

function signOut() {
  document.querySelectorAll('.modal').forEach(m => m.remove());
  db.auth.signOut().then(({ error }) => {
    if (error) toast(error.message);
  });
  $('#app').hidden = true;
  $('#auth').hidden = false;
  closeConv();
  if (location.hash) location.replace('#');
  if (mode === 'up') $('#toggle').click();
  $('#pw').value = '';
  P.id = null;
  P.user = null;
  P.name = null;
}

db.auth.onAuthStateChange(async (event, session) => {
  if (event === 'SIGNED_IN' && session?.user && $('#app').hidden) {
    try {
      await loadMyProfile(session.user);
      enter();
    } catch (err) {
      console.error(err);
      toast(err.message || 'Could not load your profile.');
    }
  }
});

(async function restoreSession() {
  try {
    const { data, error } = await db.auth.getSession();
    if (error) throw error;
    if (data.session?.user) {
      await loadMyProfile(data.session.user);
      enter();
    }
  } catch (err) {
    console.error(err);
    toast('Could not restore your session. Please sign in again.');
  }
})();

// Keep the real Supabase authentication handlers; do not restore demo login.
$('#go').onclick = handleAuthSubmit;
$('#google').onclick = () => toast('Google sign-in will be enabled after OAuth configuration.');
$('#pwt').onclick = () => {
  const p = $('#pw'), sh = p.type === 'password';
  p.type = sh ? 'text' : 'password';
  $('#pwt').textContent = sh ? 'Hide' : 'Show';
  $('#pwt').setAttribute('aria-label', sh ? 'Hide password' : 'Show password');
};
$('#auth').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') $('#go').click();
});
$('#send').onpointerdown = e => e.preventDefault();

/* Mobile VisualViewport Sync - Keeps Header & Messages Pinned Above Keyboard */
const vv = window.visualViewport;
function fit() {
  if (!$('#auth').hidden) return;
  const h = vv ? vv.height : window.innerHeight;
  const top = vv ? vv.offsetTop : 0;
  const a = $('#app');
  a.style.height = h + 'px';
  a.style.transform = top ? 'translateY(' + top + 'px)' : '';
  if (window.scrollY || window.scrollX) window.scrollTo(0, 0);
  if (cur !== null) {
    const p = $('#msgs');
    if (document.activeElement === $('#txt') || p.scrollHeight - p.scrollTop - p.clientHeight < 220) {
      p.scrollTop = p.scrollHeight;
    }
  }
}
if (vv) {
  vv.addEventListener('resize', fit);
  vv.addEventListener('scroll', fit);
}
addEventListener('resize', fit);
</script>
